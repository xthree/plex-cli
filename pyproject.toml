[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plex-cli"
version = "0.1.0"
description = "Interactive CLI for Plex Media Server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "rich>=13",
    "questionary>=2.0",
    "requests>=2.28",
]

[project.scripts]
plex-cli = "plex_cli.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-mock>=3",
    "responses>=0.25",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["plex_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
